{% load static %}
<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>MovieSite - Home</title>
        <link rel="stylesheet" href="{% static 'main.css' %}" />
    </head>
    <body>
        <!-- NAVBAR -->
        <header class="navbar" id="navbar">
            <!-- Logo -->
            <div class="brand">
                <img
                    src="{% static 'images/logo_v3.svg' %}"
                    alt="MovieSite Logo"
                />
            </div>
            
            <!-- Desktop navigation links -->
            <nav id="navLinks">
                <a href="/">Home</a>
                <a href="#">Browse</a>
                <a href="#">My List</a>
                <a href="#">Search</a>
            </nav>
            
            <!-- Mobile hamburger button -->
            <button
                id="hamburger"
                class="hamburger"
                aria-label="Open menu"
                aria-expanded="false"
                type="button"
            >
                <span></span>
                <span></span>
                <span></span>
            </button>
        </header>
        
        <!-- Mobile dropdown menu -->
        <div class="dropdown-menu" id="dropdownMenu">
            <a href="/">Home</a>
            <a href="#">Browse</a>
            <a href="#">My List</a>
            <a href="#">Search</a>
        </div>
        
        <!-- MAIN CONTENT -->
        <div class="container">
            <!-- Hero section with search -->
            <section class="search-section">
                <div class="search-content">
                    <h1>
                        Tell us what you love<span class="accent-mark">!</span>
                    </h1>
                    <input
                        type="text"
                        placeholder="Search movies, actors, genres..."
                        class="search-box"
                    />
                </div>
                
                <!-- Scroll indicator button -->
                <div class="explore-indicator" id="exploreBtn">
                    <span>Explore</span>
                    <div class="explore-arrow"></div>
                </div>
            </section>
            
            <!-- Movie carousels section -->
            <section class="movies-section">
                <!-- Loop through each movie category -->
                {% for section in movie_data %}
                <div>
                    <!-- Section title and "see more" link -->
                    <div class="section-header">
                        <h2>{{ section.title }}</h2>
                        <a href="#" class="see-more-link">SEE MORE</a>
                    </div>
                    
                    <!-- Carousel container -->
                    <div class="carousel-container">
                        <!-- Left navigation button -->
                        <button
                            class="carousel-btn left"
                            data-carousel="{{ section.id }}"
                        >
                            ‹
                        </button>
                        
                        <!-- Carousel viewport (visible area) -->
                        <div class="carousel-viewport">
                            <!-- Carousel track (scrollable content) -->
                            <div
                                class="carousel-track"
                                data-carousel-id="{{ section.id }}"
                            >
                                <!-- Loop through movies in this section -->
                                {% for movie in section.movies %}
                                <div class="movie-item">
                                    <!-- Display movie poster if available -->
                                    {% if movie.poster %}
                                    <img
                                        src="/media/{{ movie.poster }}"
                                        alt="{{ movie.title }}"
                                    />
                                    {% endif %}
                                </div>
                                {% endfor %}
                            </div>
                        </div>
                        
                        <!-- Right navigation button -->
                        <button
                            class="carousel-btn right"
                            data-carousel="{{ section.id }}"
                        >
                            ›
                        </button>
                    </div>
                </div>
                {% endfor %}
            </section>
        </div>
        
        <!-- JavaScript file -->
        <script src="{% static 'main.js' %}"></script>
    </body>
</html>
